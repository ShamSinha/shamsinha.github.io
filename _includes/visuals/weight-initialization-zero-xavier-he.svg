<text x="65" y="310" class="small" text-anchor="start">0</text>
<text x="540" y="310" class="small" text-anchor="end">20 layers</text>
<text x="65" y="35" class="small" text-anchor="start">Second moment / input · log scale</text>
<text x="580" y="85" class="orange" text-anchor="start">r = 1.50</text>
<text x="580" y="110" class="small" text-anchor="start">grows</text>
<text x="580" y="172" class="teal" text-anchor="start">r = 1.00</text>
<text x="580" y="197" class="small" text-anchor="start">stays near scale</text>
<text x="580" y="260" class="blue" text-anchor="start">r = 0.65</text>
<text x="580" y="285" class="small" text-anchor="start">shrinks</text>
<text x="400" y="345" class="label" text-anchor="middle">He + ReLU: n × (2 / n) × ½ ≈ 1</text>
</svg>
