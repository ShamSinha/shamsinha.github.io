<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="weight-initialization-zero-xavier-he-title weight-initialization-zero-xavier-he-desc">
<title id="weight-initialization-zero-xavier-he-title">Small scale errors multiply with depth</title>
<desc id="weight-initialization-zero-xavier-he-desc">In a constant-width ReLU network, the approximate per-layer second-moment multiplier is r = n · Var(w) / 2. He initialization makes this multiplier about 1.</desc>
<defs><marker id="weight-initialization-zero-xavier-he-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--vg-muted)"/></marker></defs>
<line x1="65" y1="285" x2="540" y2="285" class="axis"/>
<line x1="65" y1="285" x2="65" y2="55" class="axis"/>
<line x1="65" y1="266" x2="540" y2="266" class="line"/>
<text x="52" y="270" class="small" text-anchor="end">10⁻⁴</text>
<line x1="65" y1="218" x2="540" y2="218" class="line"/>
<text x="52" y="222" class="small" text-anchor="end">10⁻²</text>
<line x1="65" y1="170" x2="540" y2="170" class="line"/>
<text x="52" y="174" class="small" text-anchor="end">10⁰</text>
<line x1="65" y1="122" x2="540" y2="122" class="line"/>
<text x="52" y="126" class="small" text-anchor="end">10²</text>
<line x1="65" y1="74" x2="540" y2="74" class="line"/>
<text x="52" y="78" class="small" text-anchor="end">10⁴</text>
