<path d="M65.00,170.00 L88.75,170.00 L112.50,170.00 L136.25,170.00 L160.00,170.00 L183.75,170.00 L207.50,170.00 L231.25,170.00 L255.00,170.00 L278.75,170.00 L302.50,170.00 L326.25,170.00 L350.00,170.00 L373.75,170.00 L397.50,170.00 L421.25,170.00 L445.00,170.00 L468.75,170.00 L492.50,170.00 L516.25,170.00 L540.00,170.00" class="stroke-teal"/>
