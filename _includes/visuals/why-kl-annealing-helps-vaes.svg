<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="why-kl-annealing-helps-vaes-title why-kl-annealing-helps-vaes-desc">
<title id="why-kl-annealing-helps-vaes-title">First open the channel, then regularize it</title>
<desc id="why-kl-annealing-helps-vaes-desc">A rising β gradually adds KL pressure. In the scalar experiment, an overly large final β still makes zero information optimal; warmup cannot remove that incentive.</desc>
<defs><marker id="why-kl-annealing-helps-vaes-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--vg-muted)"/></marker></defs>
<line x1="55" y1="245" x2="385" y2="245" class="axis"/>
<line x1="55" y1="245" x2="55" y2="70" class="axis"/>
<path d="M55.00,245.00 L240.00,85.00 L385.00,85.00" class="stroke-teal"/>
<path d="M55.00,85.00 L385.00,85.00" class="stroke-orange dash"/>
<text x="65" y="62" class="small" text-anchor="start">KL weight β</text>
<text x="200" y="285" class="small" text-anchor="middle">training step →</text>
<text x="240" y="115" class="small" text-anchor="start">target β</text>
<text x="190" y="204" class="teal" text-anchor="start">warmup</text>
<text x="400" y="165" class="label" text-anchor="middle">→</text>
<rect x="445" y="65" width="305" height="72" rx="10" class="wash"/>
<text x="597.5" y="94" class="label" text-anchor="middle">Learn to use z</text>
<text x="597.5" y="117" class="small" text-anchor="middle">encoder + decoder coordinate</text>
<rect x="445" y="205" width="305" height="72" rx="10" class="wash-teal"/>
<text x="597.5" y="234" class="label" text-anchor="middle">Regularize the code</text>
<text x="597.5" y="257" class="small" text-anchor="middle">train at the final trade-off</text>
<line x1="597" y1="145" x2="597" y2="195" class="axis" marker-end="url(#why-kl-annealing-helps-vaes-arrow)"/>
<text x="400" y="335" class="label" text-anchor="middle">Timing helps optimization; the final objective still matters.</text>
</svg>
