<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="training-latent-diffusion-models-title training-latent-diffusion-models-desc">
<title id="training-latent-diffusion-models-title">Training and generation run in different directions</title>
<desc id="training-latent-diffusion-models-desc">Training samples one noise level and predicts a target. Generation starts from Gaussian noise and repeatedly applies a compatible reverse sampler before decoding.</desc>
<defs><marker id="training-latent-diffusion-models-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--vg-muted)"/></marker></defs>
<text x="35" y="45" class="label" text-anchor="start">TRAINING · one sampled timestep</text>
<rect x="31.0" y="75" width="156" height="72" rx="10" class="wash"/>
<text x="109.0" y="104" class="label" text-anchor="middle">Encode x</text>
<text x="109.0" y="127" class="small" text-anchor="middle">freeze the VAE</text>
<line x1="194.0" y1="111" x2="218.0" y2="111" class="axis" marker-end="url(#training-latent-diffusion-models-arrow)"/>
<rect x="225.0" y="75" width="156" height="72" rx="10" class="wash"/>
<text x="303.0" y="104" class="label" text-anchor="middle">Noise z₀ → zₜ</text>
<text x="303.0" y="127" class="small" text-anchor="middle">sample t and ε</text>
<line x1="388.0" y1="111" x2="412.0" y2="111" class="axis" marker-end="url(#training-latent-diffusion-models-arrow)"/>
<rect x="419.0" y="75" width="156" height="72" rx="10" class="wash"/>
<text x="497.0" y="104" class="label" text-anchor="middle">Denoiser</text>
<text x="497.0" y="127" class="small" text-anchor="middle">predict ε, z₀, or v</text>
<line x1="582.0" y1="111" x2="606.0" y2="111" class="axis" marker-end="url(#training-latent-diffusion-models-arrow)"/>
<rect x="613.0" y="75" width="156" height="72" rx="10" class="wash-teal"/>
<text x="691.0" y="104" class="label" text-anchor="middle">Loss</text>
<text x="691.0" y="127" class="small" text-anchor="middle">compare with target</text>
<text x="35" y="230" class="label" text-anchor="start">GENERATION · repeat reverse steps</text>
<rect x="31.0" y="260" width="156" height="72" rx="10" class="wash"/>
<text x="109.0" y="289" class="label" text-anchor="middle">Gaussian noise</text>
<text x="109.0" y="312" class="small" text-anchor="middle">start at zT</text>
<line x1="194.0" y1="296" x2="218.0" y2="296" class="axis" marker-end="url(#training-latent-diffusion-models-arrow)"/>
<rect x="225.0" y="260" width="156" height="72" rx="10" class="wash"/>
<text x="303.0" y="289" class="label" text-anchor="middle">Reverse sampler</text>
<text x="303.0" y="312" class="small" text-anchor="middle">use denoiser + schedule</text>
<line x1="388.0" y1="296" x2="412.0" y2="296" class="axis" marker-end="url(#training-latent-diffusion-models-arrow)"/>
<rect x="419.0" y="260" width="156" height="72" rx="10" class="wash"/>
<text x="497.0" y="289" class="label" text-anchor="middle">Clean latent</text>
<text x="497.0" y="312" class="small" text-anchor="middle">undo normalization</text>
<line x1="582.0" y1="296" x2="606.0" y2="296" class="axis" marker-end="url(#training-latent-diffusion-models-arrow)"/>
<rect x="613.0" y="260" width="156" height="72" rx="10" class="wash-teal"/>
<text x="691.0" y="289" class="label" text-anchor="middle">Decode</text>
<text x="691.0" y="312" class="small" text-anchor="middle">return to pixels</text>
</svg>
