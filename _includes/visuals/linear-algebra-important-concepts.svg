<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="linear-algebra-important-concepts-title linear-algebra-important-concepts-desc">
<title id="linear-algebra-important-concepts-title">See a matrix act on space</title>
<desc id="linear-algebra-important-concepts-desc">A = diag(2, 1) doubles horizontal lengths. The unit circle becomes an ellipse; the coordinate axes remain eigenvector directions.</desc>
<defs><marker id="linear-algebra-important-concepts-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--vg-muted)"/></marker></defs>
<line x1="60" y1="180" x2="310" y2="180" class="axis"/>
<line x1="60" y1="180" x2="60" y2="180" class="axis"/>
<line x1="185" y1="65" x2="185" y2="290" class="axis"/>
<text x="185" y="330" class="label" text-anchor="middle">Input: unit circle</text>
<line x1="465" y1="180" x2="715" y2="180" class="axis"/>
<line x1="465" y1="180" x2="465" y2="180" class="axis"/>
<line x1="590" y1="65" x2="590" y2="290" class="axis"/>
<text x="590" y="330" class="label" text-anchor="middle">Output: ellipse</text>
<circle cx="185" cy="180" r="75" class="stroke-blue"/>
<ellipse cx="590" cy="180" rx="150" ry="75" class="stroke-teal"/>
<line x1="185" y1="180" x2="260" y2="180" class="stroke-orange" marker-end="url(#linear-algebra-important-concepts-arrow)"/>
<line x1="590" y1="180" x2="740" y2="180" class="stroke-orange" marker-end="url(#linear-algebra-important-concepts-arrow)"/>
<line x1="185" y1="180" x2="185" y2="105" class="stroke-blue" marker-end="url(#linear-algebra-important-concepts-arrow)"/>
<line x1="590" y1="180" x2="590" y2="105" class="stroke-blue" marker-end="url(#linear-algebra-important-concepts-arrow)"/>
<rect x="324" y="137" width="130" height="82" rx="10" class="wash"/>
<text x="389.0" y="166" class="label" text-anchor="middle">A</text>
<text x="389.0" y="189" class="small" text-anchor="middle">diag(2, 1)</text>
<line x1="285" y1="180" x2="313" y2="180" class="axis" marker-end="url(#linear-algebra-important-concepts-arrow)"/>
<line x1="464" y1="180" x2="488" y2="180" class="axis" marker-end="url(#linear-algebra-important-concepts-arrow)"/>
<text x="185" y="46" class="small" text-anchor="middle">e₂ → e₂</text>
<text x="590" y="46" class="small" text-anchor="middle">e₁ → 2e₁</text>
</svg>
