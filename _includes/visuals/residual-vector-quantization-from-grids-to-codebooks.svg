<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="residual-vector-quantization-from-grids-to-codebooks-title residual-vector-quantization-from-grids-to-codebooks-desc">
<title id="residual-vector-quantization-from-grids-to-codebooks-title">Every stage encodes what remains</title>
<desc id="residual-vector-quantization-from-grids-to-codebooks-desc">For x = (4.6, 2.3), the selected codewords sum to (4.55, 2.12). The final residual is (0.05, 0.18). The arrows are successive corrections, not nested grid cells.</desc>
<defs><marker id="residual-vector-quantization-from-grids-to-codebooks-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--vg-muted)"/></marker></defs>
<line x1="55" y1="280" x2="485" y2="280" class="axis"/>
<line x1="55" y1="280" x2="55" y2="60" class="axis"/>
<line x1="55" y1="280" x2="375" y2="120" class="stroke-blue" marker-end="url(#residual-vector-quantization-from-grids-to-codebooks-arrow)"/>
<line x1="375" y1="120" x2="415.0" y2="112.0" class="stroke-teal" marker-end="url(#residual-vector-quantization-from-grids-to-codebooks-arrow)"/>
<line x1="415.0" y1="112.0" x2="419.0" y2="110.39999999999998" class="stroke-orange" marker-end="url(#residual-vector-quantization-from-grids-to-codebooks-arrow)"/>
<circle cx="423.0" cy="96.0" r="5" class="orange"/>
<text x="440" y="77" class="small" text-anchor="end">target x</text>
<text x="195" y="230" class="blue" text-anchor="start">c₁ = (4, 2)</text>
<text x="400" y="155" class="small" text-anchor="start">c₂ + c₃</text>
<line x1="419.0" y1="110.39999999999998" x2="423.0" y2="96.0" class="stroke-orange dash"/>
<rect x="530" y="40" width="230" height="72" rx="10" class="wash-teal"/>
<text x="645.0" y="69" class="label" text-anchor="middle">Stage 1</text>
<text x="645.0" y="92" class="small" text-anchor="middle">r₁ = (0.6, 0.3)</text>
<rect x="530" y="142" width="230" height="72" rx="10" class="wash-teal"/>
<text x="645.0" y="171" class="label" text-anchor="middle">Stage 2</text>
<text x="645.0" y="194" class="small" text-anchor="middle">r₂ = (0.1, 0.2)</text>
<rect x="530" y="244" width="230" height="72" rx="10" class="wash-teal"/>
<text x="645.0" y="273" class="label" text-anchor="middle">Stage 3</text>
<text x="645.0" y="296" class="small" text-anchor="middle">r₃ = (0.05, 0.18)</text>
<text x="260" y="330" class="small" text-anchor="middle">Reconstruction = selected vectors added together</text>
</svg>
